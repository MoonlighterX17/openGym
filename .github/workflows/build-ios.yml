name: Build iOS App for AltStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm install @capacitor/core @capacitor/ios @capacitor/cli

      - name: Build Web Application
        run: |
          npm run build || true

      - name: Prepare Capacitor & Generate Native iOS Project
        run: |
          # 1. Stellt sicher, dass ein gültiger Web-Ordner existiert
          if [ -d "dist" ]; then WEB_DIR="dist"; elif [ -d "build" ]; then WEB_DIR="build"; else WEB_DIR="www"; mkdir -p www; fi
          
          # 2. Initalisiert Capacitor mit der Konfiguration
          npx cap init "openGym" "com.opengym.app" --web-dir "$WEB_DIR" || true
          
          # 3. Erstellt die native Xcode-Ordnerstruktur (ios/App/App.xcworkspace)
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode App (Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package IPA for AltStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r openGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-iOS-IPA
          path: openGym.ipa
