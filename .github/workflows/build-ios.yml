name: Build iOS App for AltStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: |
          npm ci || npm install
          npm install @capacitor/core @capacitor/ios @capacitor/cli

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci || npm install
          npm run build:mobile || npm run build
          cd ..

      - name: Prepare Capacitor Output Directory
        run: |
          mkdir -p www
          if [ -d "frontend/dist" ]; then cp -r frontend/dist/* www/; fi
          if [ -d "frontend/build" ]; then cp -r frontend/build/* www/; fi

      - name: Create Capacitor Config File
        run: |
          echo '{
            "appId": "com.opengym.app",
            "appName": "openGym",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Add & Sync Capacitor iOS Platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode App (Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package IPA for AltStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r openGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-iOS-IPA
          path: openGym.ipa
